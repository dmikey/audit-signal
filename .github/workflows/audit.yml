name: Reusable smart contract audit
on:
  workflow_call:
    inputs:
      target:
        description: Contract file or project path in the caller repository
        type: string
        default: '.'
      solc-version:
        description: Solidity compiler version
        type: string
        default: '0.8.28'
      setup-command:
        description: Trusted dependency/build setup, e.g. npm ci or forge install
        type: string
        default: ''
      model:
        description: Provider model ID; auto only for Copilot
        type: string
        default: auto
      provider:
        description: AI provider (copilot, openai, or anthropic)
        type: string
        default: copilot
      node-version:
        description: Patched Node.js version for project setup and Copilot CLI
        type: string
        default: '26.12.1'
      discover:
        description: Search audited source for new findings beyond Slither detectors
        type: boolean
        default: true
      risk-project:
        description: Optional trusted Foundry project path; empty skips dynamic testing
        type: string
        default: ''
      risk-plan:
        description: Detector-to-test plan path in the caller repository
        type: string
        default: risk-plan.json
      fuzz-runs:
        type: number
        default: 256
      publish:
        description: Publish security issues in the caller's private repository
        type: boolean
        default: false
      max-source-bytes:
        type: number
        default: 48000
      min-severity:
        type: string
        default: Medium
      policy-file:
        description: Optional policy JSON path in the caller repository; enables a merge gate
        type: string
        default: ''
      baseline-file:
        description: Optional accepted-finding baseline JSON path in the caller repository
        type: string
        default: ''
      intent-file:
        description: Optional reviewed protocol intent JSON path in the caller repository
        type: string
        default: ''
      agent-ref:
        description: Tool revision; pin to a reviewed commit for production
        type: string
        default: v0.9.0
    secrets:
      COPILOT_TOKEN:
        description: Optional PAT with Copilot Requests; needed for personal repositories
        required: false
      OPENAI_API_KEY:
        description: OpenAI API key, used only when provider is openai
        required: false
      ANTHROPIC_API_KEY:
        description: Anthropic API key, used only when provider is anthropic
        required: false

# The caller must grant copilot-requests: write for GITHUB_TOKEN authentication.
# Scan/build, AI review and publication run on separate runners with separate tokens.
permissions: {}
concurrency:
  group: audit-signal-${{ github.repository }}-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: contracts-repo
      - uses: actions/checkout@v6
        with:
          repository: dmikey/audit-signal
          ref: ${{ inputs.agent-ref }}
          persist-credentials: false
          path: audit-tool
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - uses: astral-sh/setup-uv@v7
      - uses: foundry-rs/foundry-toolchain@v1
        if: inputs.risk-project != ''
        with:
          version: v1.8.5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build audit tool
        working-directory: audit-tool
        run: go build -trimpath -o bin/audit-signal ./cmd/audit-signal
      - name: Install pinned Slither and compiler
        working-directory: audit-tool
        env:
          SOLC: ${{ inputs.solc-version }}
        run: ./bin/audit-signal setup --solc-version "$SOLC"
      - name: Run caller's trusted project setup
        working-directory: contracts-repo
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: |
          export PATH="$GITHUB_WORKSPACE/audit-tool/.slither-venv/bin:$PATH"
          if [ -n "$SETUP_COMMAND" ]; then bash -e -o pipefail -c "$SETUP_COMMAND"; fi
      - name: Analyze contracts without AI or issue-write credentials
        env:
          TARGET: ${{ inputs.target }}
          SCOPE: ${{ github.repository }}:${{ inputs.target }}
          SOLC: ${{ inputs.solc-version }}
          SOURCE_LIMIT: ${{ inputs.max-source-bytes }}
        run: |
          ./audit-tool/bin/audit-signal audit --target "contracts-repo/$TARGET" \
            --scope "$SCOPE" --ai none --out scan-report \
            --venv audit-tool/.slither-venv \
            --solc-version "$SOLC" --max-source-bytes "$SOURCE_LIMIT"
      - name: Execute local penetration and risk tests before AI review
        if: inputs.risk-project != ''
        env:
          RISK_PROJECT: ${{ inputs.risk-project }}
          RISK_PLAN: ${{ inputs.risk-plan }}
          FUZZ_RUNS: ${{ inputs.fuzz-runs }}
          SOLC: ${{ inputs.solc-version }}
        run: |
          ./audit-tool/bin/audit-signal risk --report scan-report/report.json \
            --project "contracts-repo/$RISK_PROJECT" --source-root contracts-repo \
            --plan "contracts-repo/$RISK_PLAN" --out scan-report --fuzz-runs "$FUZZ_RUNS" \
            --solc "audit-tool/.slither-venv/.solc-select/artifacts/solc-$SOLC/solc-$SOLC"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-source-evidence
          path: scan-report/
          retention-days: 1
  review:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: dmikey/audit-signal
          ref: ${{ inputs.agent-ref }}
          persist-credentials: false
      - uses: actions/checkout@v6
        if: inputs.policy-file != '' || inputs.intent-file != ''
        with:
          persist-credentials: false
          path: contracts-repo
      - name: Validate policy inputs
        env:
          POLICY_FILE: ${{ inputs.policy-file }}
          BASELINE_FILE: ${{ inputs.baseline-file }}
        run: |
          if [ -n "$BASELINE_FILE" ] && [ -z "$POLICY_FILE" ]; then
            echo 'baseline-file requires policy-file.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v6
        if: inputs.provider == 'copilot'
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/download-artifact@v5
        with:
          name: slither-source-evidence
          path: scan-report
      - run: go build -trimpath -o bin/audit-signal ./cmd/audit-signal
      - name: Install Copilot CLI
        if: inputs.provider == 'copilot'
        run: npm install -g @github/copilot@1.0.97
      - name: Discover source-level security candidates
        if: inputs.discover
        env:
          GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && github.token || '' }}
          COPILOT_GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && secrets.COPILOT_TOKEN || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: ./bin/audit-signal discover --report scan-report/report.json --out reviewed-report --provider "$PROVIDER" --model "$MODEL"
      - name: Review all findings with AI (no model tools)
        env:
          GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && github.token || '' }}
          COPILOT_GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && secrets.COPILOT_TOKEN || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          DISCOVER: ${{ inputs.discover }}
        run: |
          if [ "$DISCOVER" = true ]; then report=reviewed-report/report.json; else report=scan-report/report.json; fi
          ./bin/audit-signal review --report "$report" --out reviewed-report --provider "$PROVIDER" --model "$MODEL"
      - name: Apply caller policy gate
        if: inputs.policy-file != ''
        env:
          POLICY_FILE: ${{ inputs.policy-file }}
          BASELINE_FILE: ${{ inputs.baseline-file }}
          INTENT_FILE: ${{ inputs.intent-file }}
        run: |
          args=(--report reviewed-report/report.json --policy "contracts-repo/$POLICY_FILE" --expected-revision "$GITHUB_SHA" --out reviewed-report)
          if [ -n "$BASELINE_FILE" ]; then args+=(--baseline "contracts-repo/$BASELINE_FILE"); fi
          if [ -n "$INTENT_FILE" ]; then args+=(--intent "contracts-repo/$INTENT_FILE"); fi
          ./bin/audit-signal gate "${args[@]}"
      - name: Map protocol assurance without a merge policy
        if: inputs.intent-file != '' && inputs.policy-file == ''
        env:
          INTENT_FILE: ${{ inputs.intent-file }}
        run: ./bin/audit-signal assure --report reviewed-report/report.json --intent "contracts-repo/$INTENT_FILE" --out reviewed-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-security-report
          path: reviewed-report/
          retention-days: 1
  publish:
    if: inputs.publish
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: dmikey/audit-signal
          ref: ${{ inputs.agent-ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/download-artifact@v5
        with:
          name: reviewed-security-report
          path: reviewed-report
      - run: go build -trimpath -o bin/audit-signal ./cmd/audit-signal
      - name: Publish candidates in the caller's private repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MIN_SEVERITY: ${{ inputs.min-severity }}
        run: ./bin/audit-signal publish --report reviewed-report/report.json --repo "$REPO" --min-severity "$MIN_SEVERITY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-publication-receipt
          path: reviewed-report/publication.json
          if-no-files-found: ignore
          retention-days: 1
