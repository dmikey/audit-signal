name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - name: Verify patched Node.js and Copilot CLI
        run: |
          test "$(node --version)" = "v26.12.1"
          npm install -g @github/copilot@1.0.97
          copilot --version
      - run: make test
      - uses: astral-sh/setup-uv@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: make smoke
      - name: Execute local exploit and fuzz tests
        run: ./bin/slither-agent risk --report reports/report.json --project examples/risk --source-root . --plan examples/risk/plan.json --solc .slither-venv/.solc-select/artifacts/solc-0.8.28/solc-0.8.28
      - name: Assert real Slither detected the intentionally vulnerable fixture
        run: |
          python3 - <<'PY'
          import json
          with open('reports/report.json') as f:
              r = json.load(f)
          assert any(x['check'] == 'reentrancy-eth' and x['severity'] == 'High' for x in r['findings']), r
          assert not r['reviewed'] and not r['imported']
          assert r['risk']['status'] == 'passed' and r['risk']['passed'] == 5
          assert len(r['risk']['untested_finding_ids']) == 1
          assert any(e['claim'] == 'exploit-reproduced' and e['status'] == 'Success' for e in r['risk']['evidence'])
          assert any(e['kind'].get('Fuzz', {}).get('runs') == 256 for e in r['risk']['evidence'])
          reentrancy = next(x for x in r['findings'] if x['check'] == 'reentrancy-eth')
          layers = reentrancy['evidence_layers']
          assert layers[0]['stage'] == 'detection' and layers[0]['tool'] == 'slither'
          assert all(x['stage'] != 'review' for x in layers)
          assert any(x['stage'] == 'dynamic-test' and x['tool'] == 'foundry' and x['status'] == 'Success' and x['claim'] == 'exploit-reproduced' for x in layers)
          PY
      - name: Scan independent-discovery fixture with real Slither
        run: ./bin/slither-agent audit --target examples/RewardPool.sol --scope example/reward-pool --ai none --solc-version 0.8.28 --out reports/reward-pool
      - name: Reproduce reward claim exploit in local EVM
        run: forge test --offline --match-contract RewardPoolRiskTest --use "$GITHUB_WORKSPACE/.slither-venv/.solc-select/artifacts/solc-0.8.28/solc-0.8.28"
        working-directory: examples/risk
      - name: Assert real reward-pool scan provenance
        run: |
          python3 - <<'PY'
          import json
          with open('reports/reward-pool/report.json') as f:
              r = json.load(f)
          assert r['imported'] is False and r['slither_version']
          assert 'examples/RewardPool.sol' in r['sources']
          assert all(x['evidence_layers'][0]['tool'] == 'slither' and x['evidence_layers'][-1]['status'] == 'not-run' for x in r['findings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: example-reward-pool-static-audit
          path: |
            reports/reward-pool/report.md
            reports/reward-pool/report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: example-vault-static-audit
          path: |
            reports/report.md
            reports/report.json
            reports/forge-results.json
            reports/risk.log
          retention-days: 7
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, suffix: ''}
          - {os: linux, arch: arm64, suffix: ''}
          - {os: darwin, arch: arm64, suffix: ''}
          - {os: darwin, arch: amd64, suffix: ''}
          - {os: windows, arch: amd64, suffix: '.exe'}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go build -trimpath -o bin/slither-agent-${GOOS}-${GOARCH}${SUFFIX} ./cmd/slither-agent
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: slither-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/*
