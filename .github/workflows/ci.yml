name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run installable action against vulnerable fixture
        id: audit
        uses: ./
        with:
          target: examples/VulnerableVault.sol
          scope: example/vault
          ai: none
          solc-version: '0.8.28'
          intent-file: examples/intent/vault-vulnerable.json
          suite-command-json: '["python3","-c","assert 2 + 2 == 4"]'
      - name: Assert action output and real Slither finding
        env:
          REPORT_JSON: ${{ steps.audit.outputs.report-json }}
          REPORT_MARKDOWN: ${{ steps.audit.outputs.report-markdown }}
          ASSURANCE_JSON: ${{ steps.audit.outputs.assurance-json }}
          COVERAGE_JSON: ${{ steps.audit.outputs.coverage-json }}
          SUITE_LOG: ${{ steps.audit.outputs.suite-log }}
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['REPORT_JSON']) as f:
              report = json.load(f)
          assert os.path.isfile(os.environ['REPORT_MARKDOWN'])
          assert report['scope'] == 'example/vault'
          assert report['reviewed'] is False
          assert len(report['project_tests']) == 1 and report['project_tests'][0]['status'] == 'passed'
          assert os.path.isfile(os.environ['SUITE_LOG'])
          assert all(any(layer['stage'] == 'dynamic-test' and layer['status'] == 'not-run' for layer in f['evidence_layers']) for f in report['findings'])
          assert any(f['check'] == 'reentrancy-eth' and f['severity'] == 'High' for f in report['findings'])
          with open(os.environ['ASSURANCE_JSON']) as f:
              assurance = json.load(f)
          assert all(i['status'] == 'untested' for i in assurance['invariants'])
          with open(os.environ['COVERAGE_JSON']) as f:
              coverage = json.load(f)
          assert coverage['status'] == 'complete' and len(coverage['target_sources']) == 1, coverage
          PY
  action-policy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Action with caller policy against clean fixture
        id: audit
        uses: ./
        with:
          target: examples/RewardPool.sol
          scope: example/policy-reward-pool
          ai: none
          solc-version: '0.8.28'
          policy-file: examples/policy.json
      - name: Assert policy receipt
        env:
          GATE_JSON: ${{ steps.audit.outputs.gate-json }}
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GATE_JSON']) as f:
              gate = json.load(f)
          assert gate['passed'] and gate['blocked'] == 0, gate
          assert gate['policy']['evidence'] == 'slither-detected'
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - name: Verify patched Node.js and Copilot CLI
        run: |
          test "$(node --version)" = "v26.12.1"
          npm install -g @github/copilot@1.0.97
          copilot --version
      - run: make test
      - uses: astral-sh/setup-uv@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: make smoke
      - name: Execute local exploit and fuzz tests
        run: ./bin/audit-signal risk --report reports/report.json --project examples/risk --source-root . --plan examples/risk/plan.json --solc .slither-venv/.solc-select/artifacts/solc-0.8.28/solc-0.8.28
      - name: Assert real Slither detected the intentionally vulnerable fixture
        run: |
          python3 - <<'PY'
          import json
          with open('reports/report.json') as f:
              r = json.load(f)
          assert any(x['check'] == 'reentrancy-eth' and x['severity'] == 'High' for x in r['findings']), r
          assert not r['reviewed'] and not r['imported']
          assert r['risk']['status'] == 'passed' and r['risk']['passed'] == 5
          assert len(r['risk']['untested_finding_ids']) == 1
          assert any(e['claim'] == 'exploit-reproduced' and e['status'] == 'Success' for e in r['risk']['evidence'])
          assert any(e['kind'].get('Fuzz', {}).get('runs') == 256 for e in r['risk']['evidence'])
          reentrancy = next(x for x in r['findings'] if x['check'] == 'reentrancy-eth')
          layers = reentrancy['evidence_layers']
          assert layers[0]['stage'] == 'detection' and layers[0]['tool'] == 'slither'
          assert all(x['stage'] != 'review' for x in layers)
          assert any(x['stage'] == 'dynamic-test' and x['tool'] == 'foundry' and x['status'] == 'Success' and x['claim'] == 'exploit-reproduced' for x in layers)
          PY
      - name: Verify vulnerable vault assurance blocks the gate
        run: |
          ./bin/audit-signal assure --report reports/report.json --intent examples/intent/vault-vulnerable.json --out reports
          if ./bin/audit-signal gate --report reports/report.json --policy examples/intent/policy.json --intent examples/intent/vault-vulnerable.json --out reports; then
            echo 'Vulnerable vault unexpectedly passed the gate.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('reports/assurance.json') as f: assurance = json.load(f)
          with open('reports/gate.json') as f: gate = json.load(f)
          states = {i['id']: i['status'] for i in assurance['invariants']}
          assert states == {'depositor-funds-isolated': 'counterexample-local', 'failed-transfer-keeps-credit': 'unmapped'}, states
          assert not gate['passed'] and any(d['id'] == 'depositor-funds-isolated' and d['blocked'] for d in gate['invariant_decisions'])
          assert all(t['subject_source'] == 'examples/VulnerableVault.sol' for i in assurance['invariants'] for t in i['tests'])
          PY
      - name: Verify repaired vault local properties and lower-priority gap
        run: |
          ./bin/audit-signal audit --target examples/risk/src/FixedVault.sol --scope example/fixed-vault --ai none --solc-version 0.8.28 --out reports/fixed-vault
          ./bin/audit-signal risk --report reports/fixed-vault/report.json --project examples/risk --source-root . --plan examples/risk/fixed-plan.json --out reports/fixed-vault --solc .slither-venv/.solc-select/artifacts/solc-0.8.28/solc-0.8.28
          ./bin/audit-signal gate --report reports/fixed-vault/report.json --policy examples/intent/policy.json --intent examples/intent/vault-fixed.json --out reports/fixed-vault
          python3 - <<'PY'
          import json
          with open('reports/fixed-vault/assurance.json') as f: assurance = json.load(f)
          with open('reports/fixed-vault/gate.json') as f: gate = json.load(f)
          states = {i['id']: i for i in assurance['invariants']}
          assert states['depositor-funds-isolated']['status'] == 'checked-local'
          assert states['failed-transfer-keeps-credit']['status'] == 'checked-local'
          assert states['deposit-credit-matches-value']['status'] == 'unmapped'
          assert states['deposit-credit-matches-value']['proposal']
          assert gate['passed'] and gate['blocked'] == 0, gate
          assert all(t['subject_source'] == 'examples/risk/src/FixedVault.sol' for i in assurance['invariants'] for t in i['tests'])
          PY
      - name: Verify multi-contract compilation coverage and merge gate
        run: |
          ./bin/audit-signal audit --target examples/coverage --scope example/coverage --ai none --solc-version 0.8.28 --out reports/coverage
          ./bin/audit-signal gate --report reports/coverage/report.json --policy examples/coverage/policy.json --out reports/coverage
          python3 - <<'PY'
          import json
          with open('reports/coverage/coverage.json') as f: coverage = json.load(f)
          with open('reports/coverage/gate.json') as f: gate = json.load(f)
          expected = {'examples/coverage/src/Ledger.sol', 'examples/coverage/src/Router.sol', 'examples/coverage/src/Policy.sol'}
          assert coverage['status'] == 'complete' and not coverage['unresolved'], coverage
          assert {x['path'] for x in coverage['target_sources']} == expected, coverage
          assert expected <= {x['path'] for x in coverage['compiled_sources']}, coverage
          assert gate['passed'] and gate['coverage_decision']['status'] == 'complete', gate
          PY
      - name: Scan independent-discovery fixture with real Slither
        run: ./bin/audit-signal audit --target examples/RewardPool.sol --scope example/reward-pool --ai none --solc-version 0.8.28 --out reports/reward-pool
      - name: Reproduce reward claim exploit in local EVM
        run: forge test --offline --match-contract RewardPoolRiskTest --use "$GITHUB_WORKSPACE/.slither-venv/.solc-select/artifacts/solc-0.8.28/solc-0.8.28"
        working-directory: examples/risk
      - name: Assert real reward-pool scan provenance
        run: |
          python3 - <<'PY'
          import json
          with open('reports/reward-pool/report.json') as f:
              r = json.load(f)
          assert r['imported'] is False and r['slither_version']
          assert 'examples/RewardPool.sol' in r['sources']
          assert all(x['evidence_layers'][0]['tool'] == 'slither' and x['evidence_layers'][-1]['status'] == 'not-run' for x in r['findings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: example-reward-pool-static-audit
          path: |
            reports/reward-pool/report.md
            reports/reward-pool/report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: example-vault-static-audit
          path: |
            reports/report.md
            reports/report.json
            reports/forge-results.json
            reports/risk.log
            reports/assurance.json
            reports/assurance.md
            reports/gate.json
            reports/gate.md
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: example-fixed-vault-assurance
          path: reports/fixed-vault/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: example-multi-contract-coverage
          path: reports/coverage/
          retention-days: 7
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, suffix: ''}
          - {os: linux, arch: arm64, suffix: ''}
          - {os: darwin, arch: arm64, suffix: ''}
          - {os: darwin, arch: amd64, suffix: ''}
          - {os: windows, arch: amd64, suffix: '.exe'}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go build -trimpath -o bin/audit-signal-${GOOS}-${GOARCH}${SUFFIX} ./cmd/audit-signal
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: audit-signal-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/*
