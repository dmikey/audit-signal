name: Audit Signal
description: Install Audit Signal and audit the caller repository with Slither and optional AI review
branding:
  icon: shield
  color: purple
inputs:
  target:
    description: Contract file or project directory relative to the caller checkout
    default: '.'
  scope:
    description: Stable finding identity; defaults to repository and target path
    default: ''
  solc-version:
    description: Solidity compiler version to install
    default: '0.8.28'
  ai:
    description: review (default, using Copilot) or none for a static-only scan
    default: review
  discover:
    description: Search for additional source-level candidates before AI review
    default: 'false'
  provider:
    description: copilot, openai, or anthropic
    default: copilot
  model:
    description: Provider model ID; auto is supported only for Copilot
    default: auto
  copilot-token:
    description: Optional Copilot PAT stored in GitHub Actions secrets
    default: ''
  openai-api-key:
    description: OpenAI API key stored in GitHub Actions secrets
    default: ''
  anthropic-api-key:
    description: Anthropic API key stored in GitHub Actions secrets
    default: ''
  max-source-bytes:
    description: Maximum bundled source bytes; oversized input fails
    default: '48000'
  policy-file:
    description: Optional caller-repository policy JSON; enables the merge gate
    default: ''
  baseline-file:
    description: Optional caller-repository accepted-finding baseline JSON
    default: ''
  intent-file:
    description: Optional reviewed protocol intent JSON for invariant assurance
    default: ''
  suite-project:
    description: Trusted test project path within the caller checkout
    default: '.'
  suite-command-json:
    description: Optional JSON string array of a project test executable and arguments
    default: ''
outputs:
  report-json:
    description: Absolute path to the machine-readable report
    value: ${{ steps.report.outputs.report-json }}
  report-markdown:
    description: Absolute path to the human-readable report
    value: ${{ steps.report.outputs.report-markdown }}
  gate-json:
    description: Absolute path to the policy decision JSON when enabled
    value: ${{ steps.report.outputs.gate-json }}
  gate-markdown:
    description: Absolute path to the policy decision Markdown when enabled
    value: ${{ steps.report.outputs.gate-markdown }}
  assurance-json:
    description: Absolute path to the protocol assurance JSON when enabled
    value: ${{ steps.report.outputs.assurance-json }}
  assurance-markdown:
    description: Absolute path to the protocol assurance Markdown when enabled
    value: ${{ steps.report.outputs.assurance-markdown }}
  coverage-json:
    description: Absolute path to the compilation coverage receipt
    value: ${{ steps.report.outputs.coverage-json }}
  coverage-markdown:
    description: Absolute path to the human-readable compilation coverage receipt
    value: ${{ steps.report.outputs.coverage-markdown }}
  suite-log:
    description: Absolute path to the project test suite log when enabled
    value: ${{ steps.suite.outputs.log-path }}
runs:
  using: composite
  steps:
    - name: Check runner and inputs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        AI: ${{ inputs.ai }}
        DISCOVER: ${{ inputs.discover }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        POLICY_FILE: ${{ inputs.policy-file }}
        BASELINE_FILE: ${{ inputs.baseline-file }}
        INTENT_FILE: ${{ inputs.intent-file }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != Linux && "$RUNNER_OS" != macOS ]]; then
          echo 'Audit Signal action supports Linux and macOS runners.' >&2
          exit 1
        fi
        if [[ "$AI" != none && "$AI" != review ]]; then
          echo 'ai must be none or review.' >&2
          exit 1
        fi
        if [[ "$DISCOVER" != true && "$DISCOVER" != false ]]; then
          echo 'discover must be true or false.' >&2
          exit 1
        fi
        if [[ "$DISCOVER" == true && "$AI" != review ]]; then
          echo 'discover requires ai: review.' >&2
          exit 1
        fi
        if [[ "$AI" == review ]]; then
          case "$PROVIDER" in copilot|openai|anthropic) ;; *) echo 'Unsupported AI provider.' >&2; exit 1 ;; esac
          if [[ "$PROVIDER" != copilot && "$MODEL" == auto ]]; then
            echo 'Specify a model ID for this provider.' >&2
            exit 1
          fi
        fi
        if [[ -z "$TARGET" ]]; then echo 'target cannot be empty.' >&2; exit 1; fi
        if [[ -n "$BASELINE_FILE" && -z "$POLICY_FILE" ]]; then echo 'baseline-file requires policy-file.' >&2; exit 1; fi
        work="$(mktemp -d "$RUNNER_TEMP/audit-signal.XXXXXX")"
        {
          echo "AUDIT_SIGNAL_BIN=$work/audit-signal"
          echo "AUDIT_SIGNAL_VENV=$work/venv"
          echo "AUDIT_SIGNAL_REPORT=$work/report"
        } >> "$GITHUB_ENV"
    - uses: actions/setup-go@v6
      with:
        go-version: '1.24.x'
        cache: false
    - uses: astral-sh/setup-uv@v7
    - name: Build scanner and install Slither
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOLC_VERSION: ${{ inputs.solc-version }}
      run: |
        set -euo pipefail
        (cd "$ACTION_PATH" && go build -trimpath -o "$AUDIT_SIGNAL_BIN" ./cmd/audit-signal)
        "$AUDIT_SIGNAL_BIN" setup --venv "$AUDIT_SIGNAL_VENV" --solc-version "$SOLC_VERSION"
    - name: Scan contracts with Slither
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SCOPE: ${{ inputs.scope }}
        SOLC_VERSION: ${{ inputs.solc-version }}
        MAX_SOURCE_BYTES: ${{ inputs.max-source-bytes }}
      run: |
        set -euo pipefail
        if [[ -z "$SCOPE" ]]; then SCOPE="$GITHUB_REPOSITORY:$TARGET"; fi
        "$AUDIT_SIGNAL_BIN" audit --target "$TARGET" --scope "$SCOPE" \
          --ai none --venv "$AUDIT_SIGNAL_VENV" --solc-version "$SOLC_VERSION" \
          --max-source-bytes "$MAX_SOURCE_BYTES" --out "$AUDIT_SIGNAL_REPORT"
    - name: Run trusted project test suite
      id: suite
      if: inputs.suite-command-json != ''
      shell: bash
      env:
        SUITE_PROJECT: ${{ inputs.suite-project }}
        SUITE_COMMAND_JSON: ${{ inputs.suite-command-json }}
      run: |
        set -euo pipefail
        "$AUDIT_SIGNAL_BIN" suite --report "$AUDIT_SIGNAL_REPORT/report.json" \
          --source-root "$GITHUB_WORKSPACE" --project "$GITHUB_WORKSPACE/$SUITE_PROJECT" \
          --command-json "$SUITE_COMMAND_JSON" --out "$AUDIT_SIGNAL_REPORT"
        log_path="$(find "$AUDIT_SIGNAL_REPORT" -maxdepth 1 -name 'project-suite-*.log' -print -quit)"
        echo "log-path=$log_path" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v6
      if: inputs.ai == 'review' && inputs.provider == 'copilot'
      with:
        node-version: '26.12.1'
    - name: Install Copilot CLI
      if: inputs.ai == 'review' && inputs.provider == 'copilot'
      shell: bash
      run: npm install -g @github/copilot@1.0.97
    - name: Discover source-level security candidates
      if: inputs.ai == 'review' && inputs.discover == 'true'
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && github.token || '' }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && inputs.copilot-token || '' }}
        OPENAI_API_KEY: ${{ inputs.provider == 'openai' && inputs.openai-api-key || '' }}
        ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && inputs.anthropic-api-key || '' }}
      run: |
        "$AUDIT_SIGNAL_BIN" discover --report "$AUDIT_SIGNAL_REPORT/report.json" \
          --out "$AUDIT_SIGNAL_REPORT" --provider "$PROVIDER" --model "$MODEL"
    - name: Review findings with AI
      if: inputs.ai == 'review'
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && github.token || '' }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.provider == 'copilot' && inputs.copilot-token || '' }}
        OPENAI_API_KEY: ${{ inputs.provider == 'openai' && inputs.openai-api-key || '' }}
        ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && inputs.anthropic-api-key || '' }}
      run: |
        "$AUDIT_SIGNAL_BIN" review --report "$AUDIT_SIGNAL_REPORT/report.json" \
          --out "$AUDIT_SIGNAL_REPORT" --provider "$PROVIDER" --model "$MODEL"
    - name: Apply caller policy gate
      if: inputs.policy-file != ''
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.policy-file }}
        BASELINE_FILE: ${{ inputs.baseline-file }}
        INTENT_FILE: ${{ inputs.intent-file }}
      run: |
        set -euo pipefail
        args=(--report "$AUDIT_SIGNAL_REPORT/report.json" --policy "$POLICY_FILE" --expected-revision "$GITHUB_SHA" --out "$AUDIT_SIGNAL_REPORT")
        if [[ -n "$BASELINE_FILE" ]]; then args+=(--baseline "$BASELINE_FILE"); fi
        if [[ -n "$INTENT_FILE" ]]; then args+=(--intent "$INTENT_FILE"); fi
        "$AUDIT_SIGNAL_BIN" gate "${args[@]}"
    - name: Map protocol assurance without a merge policy
      if: inputs.intent-file != '' && inputs.policy-file == ''
      shell: bash
      env:
        INTENT_FILE: ${{ inputs.intent-file }}
      run: |
        "$AUDIT_SIGNAL_BIN" assure --report "$AUDIT_SIGNAL_REPORT/report.json" \
          --intent "$INTENT_FILE" --out "$AUDIT_SIGNAL_REPORT"
    - name: Expose report paths
      id: report
      if: always()
      shell: bash
      run: |
        echo "report-json=$AUDIT_SIGNAL_REPORT/report.json" >> "$GITHUB_OUTPUT"
        echo "report-markdown=$AUDIT_SIGNAL_REPORT/report.md" >> "$GITHUB_OUTPUT"
        echo "gate-json=$AUDIT_SIGNAL_REPORT/gate.json" >> "$GITHUB_OUTPUT"
        echo "gate-markdown=$AUDIT_SIGNAL_REPORT/gate.md" >> "$GITHUB_OUTPUT"
        echo "assurance-json=$AUDIT_SIGNAL_REPORT/assurance.json" >> "$GITHUB_OUTPUT"
        echo "assurance-markdown=$AUDIT_SIGNAL_REPORT/assurance.md" >> "$GITHUB_OUTPUT"
        echo "coverage-json=$AUDIT_SIGNAL_REPORT/coverage.json" >> "$GITHUB_OUTPUT"
        echo "coverage-markdown=$AUDIT_SIGNAL_REPORT/coverage.md" >> "$GITHUB_OUTPUT"
